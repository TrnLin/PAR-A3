# =============================================================================
# Traffic Light Obedience Parameters — ROSbot 3 PRO (Project B)
# =============================================================================

signal_detector:
  ros__parameters:
    # --- Camera topics ---
    rgb_image_topic: "/camera/camera/color/image_raw"
    depth_image_topic: "/camera/camera/depth/image_rect_raw"

    # --- Detection rate ---
    detection_rate_hz: 15.0

    # --- HSV ranges for signal colors ---
    # Red (wraps around hue 0/180, so two ranges)
    red_h_low1: 0
    red_h_high1: 10
    red_h_low2: 170
    red_h_high2: 180
    red_s_low: 100
    red_s_high: 255
    red_v_low: 80
    red_v_high: 255

    # Yellow
    yellow_h_low: 20
    yellow_h_high: 35
    yellow_s_low: 100
    yellow_s_high: 255
    yellow_v_low: 100
    yellow_v_high: 255

    # Green
    green_h_low: 40
    green_h_high: 80
    green_s_low: 80
    green_s_high: 255
    green_v_low: 80
    green_v_high: 255

    # --- Spatial gating ---
    use_depth_gating: true          # set false for ablation (with vs without depth gating)
    max_signal_distance: 1.5        # metres — ignore signals beyond this
    gate_angle_deg: 20.0            # degrees — ignore signals outside ±20° of heading

    # --- Filtering ---
    min_signal_area: 800            # pixels — minimum contour area to consider
    confirm_frames: 3               # consecutive frames required to confirm detection

navigation_controller:
  ros__parameters:
    # --- Speed ---
    cruise_speed: 0.25              # m/s — full cruising speed (GREEN)
    max_angular_speed: 0.8          # rad/s — maximum turning rate

    # --- LIDAR corridor navigation ---
    lidar_topic: "/scan"
    front_clear_distance: 0.8       # m — front is "clear" if > this
    emergency_stop_distance: 0.2    # m — hard stop if obstacle closer than this
    wall_follow_gain: 1.0           # proportional gain for corridor centering

    # --- Signal handling ---
    unknown_timeout: 3.0            # seconds — default to YELLOW behaviour after this
    control_rate_hz: 20.0

traffic_logger:
  ros__parameters:
    log_directory: "/tmp/traffic_light_logs"
    log_rate_hz: 5.0
    odom_topic: "/odometry/filtered"
