# =============================================================================
# Reactive Navigation Parameters — ROSbot 3 PRO
# =============================================================================

sensor_fusion:
  ros__parameters:
    # --- Topic names (configurable for different ROSbot setups) ---
    # Use /scan_filtered: Husarion's laser_filter node strips out beams that
    # hit the robot's own chassis, antenna mast, and sensor brackets. Without
    # this, the LIDAR sees self-reflections at ~0.07-0.08m and the navigator
    # gets stuck thinking it's surrounded by obstacles.
    lidar_topic: "/scan_filtered"
    depth_image_topic: "/camera/camera/depth/image_rect_raw"
    depth_info_topic: "/camera/camera/depth/camera_info"
    tof_front_left_topic: "/range/fl"
    tof_front_right_topic: "/range/fr"
    tof_rear_left_topic: "/range/rl"
    tof_rear_right_topic: "/range/rr"

    # --- Sector configuration ---
    num_sectors: 12                 # 12 sectors of 30 degrees each
    max_range: 5.0                  # metres — readings beyond this are ignored
    # Raised from 0.05 to 0.10: anything closer than 10cm is treated as a
    # self-reflection / sensor noise rather than a real obstacle (defense-in-
    # depth on top of /scan_filtered).
    min_valid_range: 0.10           # metres — readings below this are ignored as noise

    # --- Depth camera parameters ---
    depth_camera_hfov: 72.0         # OAK-D Pro horizontal FOV in degrees
    depth_max_range: 4.0            # metres — max usable depth range
    depth_min_range: 0.2            # metres — min usable depth range
    use_depth_camera: true          # set false for LIDAR-only ablation

    # --- Dynamic obstacle detection ---
    dynamic_detect_threshold: 0.3   # m/s — rate of distance decrease to flag dynamic
    sector_history_window: 5        # number of past readings to track per sector

    # --- Publish rate ---
    fusion_rate_hz: 20.0            # Hz — how often to publish fused sectors

reactive_navigator:
  ros__parameters:
    # --- Speed limits ---
    max_linear_speed: 0.3           # m/s — full cruising speed
    min_linear_speed: 0.05          # m/s — minimum forward speed
    narrow_passage_speed: 0.12      # m/s — speed through narrow passages
    max_angular_speed: 1.2          # rad/s — maximum turning rate
    backup_speed: -0.15             # m/s — reverse speed for dead-end recovery

    # --- Distance thresholds ---
    free_roam_threshold: 1.2        # m — all sectors clear beyond this = FREE_ROAM
    careful_threshold: 0.8          # m — obstacles detected, engage VFF
    narrow_threshold: 0.5           # m — side obstacles = narrow passage
    avoid_threshold: 0.35           # m — front obstacle very close, hard avoid
    dead_end_threshold: 0.5         # m — front+left+right blocked = dead end
    critical_threshold: 0.2         # m — imminent collision

    # --- VFF (Virtual Force Field) parameters ---
    drive_gain: 1.0                 # forward driving force magnitude
    repulsive_gain: 0.8             # repulsive force gain
    influence_distance: 1.5         # m — obstacles beyond this exert no force
    damping: 0.3                    # velocity smoothing factor (0=no smoothing, 1=full)

    # --- Exploration ---
    random_bias_interval: 4.0       # seconds — how often to change random exploration bias
    random_bias_magnitude: 0.3      # rad/s — max random angular bias

    # --- Dead-end recovery ---
    backup_duration: 2.0            # seconds to back up
    rotate_duration: 2.5            # seconds to rotate after backing up
    rotate_speed: 1.0               # rad/s during dead-end recovery rotation

    # --- Dynamic obstacle response ---
    dynamic_obstacle_margin: 0.6    # m — extra clearance for dynamic obstacles
    dynamic_avoidance_gain: 1.5     # multiplier on repulsive force for dynamic obstacles

    # --- AVOIDING-state tuning (anti-spin) ---
    # Once AVOIDING picks a turn direction, hold it for this long before
    # re-evaluating which side has more space. Prevents direction-flip
    # oscillation that causes the robot to spin in place.
    avoiding_commit_time: 1.5       # seconds
    avoiding_angular_speed: 0.9     # rad/s — slower than max so linear can carry
    avoiding_linear_speed: 0.08     # m/s — actually move forward while turning
    # If AVOIDING persists this long, force dead-end recovery (back up + rotate)
    avoiding_timeout: 6.0           # seconds

    # --- Control rate ---
    control_rate_hz: 20.0           # Hz

safety_monitor:
  ros__parameters:
    # --- ToF emergency stop ---
    emergency_stop_distance: 0.10   # m — hard stop if ANY ToF reads below this
    resume_distance: 0.25           # m — resume navigation when ToF reads above this
    tof_timeout: 0.5                # s — if no ToF data for this long, assume safe

    # --- Topics ---
    tof_front_left_topic: "/range/fl"
    tof_front_right_topic: "/range/fr"
    nav_cmd_vel_topic: "/nav_cmd_vel"
    cmd_vel_topic: "/cmd_vel"

    # --- Rate ---
    monitor_rate_hz: 50.0           # Hz — safety-critical, runs faster than nav

data_logger:
  ros__parameters:
    # --- Logging ---
    log_directory: "/tmp/reactive_nav_logs"
    log_rate_hz: 5.0                # Hz — how often to write a log entry
    collision_distance_threshold: 0.08  # m — contact event if any sensor reads below this

    # --- Topics ---
    odom_topic: "/odometry/filtered"
