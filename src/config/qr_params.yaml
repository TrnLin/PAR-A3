# =============================================================================
# QR Code Command Navigation Parameters — ROSbot 3 PRO (Project A)
# =============================================================================

qr_detector:
  ros__parameters:
    # --- Camera topic ---
    # Husarion ROSbot 3 PRO publishes the OAK-D RGB stream under /oak/...
    # NOT the depthai-ros default /camera/camera/.../image_raw namespace.
    # Verified on the robot via `ros2 topic list | grep oak`.
    rgb_image_topic: "/oak/rgb/image_raw"

    # --- Detection ---
    detection_rate_hz: 15.0 # Hz — frame processing rate
    min_bbox_area: 500 # pixels — ignore tiny QR detections
    command_cooldown: 1.0 # seconds — debounce same command

    # --- QoS ---
    # The OAK-D publisher on Husarion uses RELIABLE / VOLATILE (verified via
    # `ros2 topic info /oak/rgb/image_raw -v`). A BEST_EFFORT subscriber
    # against a RELIABLE publisher will silently receive zero callbacks.
    image_qos_reliability: "reliable" # "reliable" or "best_effort"

    # --- Adaptive lighting (Pass 1: observe; Pass 2+: switch + IR) ---
    # Master enable. When false, the lighting monitor is bypassed and
    # behaviour is identical to the pre-adaptive version. Useful as a
    # kill-switch if the heuristic misfires on demo day.
    adaptive_lighting: true

    # Mono camera topic used in DARK mode (Pass 2+). Verify on the bot
    # with `ros2 topic list | grep oak` — Husarion's depthai-ros release
    # has shipped /oak/left/image_raw, /oak/stereo/left/image_raw, and
    # /oak/mono_left/image_raw across versions.
    mono_image_topic: "/oak/left/image_raw"

    # Luma thresholds (0–255, computed on the post-CLAHE grayscale frame).
    # Enter DIM below luma_dim_threshold; enter DARK below
    # luma_dark_threshold; rise luma_bright_hysteresis above the threshold
    # to leave the darker state (prevents flicker at the boundary).
    luma_dim_threshold: 60.0
    luma_dark_threshold: 25.0
    luma_bright_hysteresis: 20.0

    # Exponential moving average smoothing for per-frame luma.
    # 0.1 => ~10-frame time constant. Lower = smoother but slower.
    luma_ema_alpha: 0.1

    # Minimum dwell time (seconds) before a candidate state can be promoted
    # to the confirmed lighting_state. Prevents one-second clouds and
    # camera AE settling artifacts from triggering a switch.
    state_dwell_sec: 2.0

    # Sliding-window length (in detector ticks, ~detection_rate_hz) for
    # decode-success rate. 30 frames @ 15 Hz = ~2 seconds of decode history.
    decode_window_frames: 30
    # If decode_rate stays at or below this floor across a full window
    # AND luma is near a transition boundary, force one step darker.
    # Default 0.0 means "force escalate only on total decode failure".
    decode_failure_threshold: 0.0

    # /qr_detector/lighting_state publish rate. Independent of the frame
    # rate so subscribers still get updates if the camera stalls.
    lighting_publish_rate_hz: 2.0

    # Maximum time (s) to wait for a valid QR decode on the NEW sensor
    # after a switch. On timeout the detector publishes "timeout" on
    # /qr_detector/switch_complete; the interpreter leaves the robot in
    # STOPPED and the operator must intervene with a GO card.
    validation_timeout_sec: 10.0

    # On validation timeout the detector reverts to the RGB feed (so
    # the lighting monitor can recover) and then suppresses retries
    # to the same target sensor for this many seconds. Prevents
    # ping-ponging when the underlying problem (no mono frames, phone
    # QR undecodable under IR) hasn't changed. Set to 0 to retry
    # immediately on the next confirmed lighting transition.
    switch_failure_cooldown_sec: 30.0

    # --- Pass 3: IR floodlight + dot-projector control ---
    # Names of the depthai camera ROS node and its IR parameters. Verify
    # on the bot with `ros2 param list /oak | grep -iE 'flood|laser|ir'`.
    # Husarion's depthai-ros build (verified 2026-05) namespaces these
    # under `camera.` and uses `laser_dot_brightness` (not `_current`).
    # Older / upstream releases use bare `i_floodlight_brightness` /
    # `i_laser_dot_projector_current` — override here only, no code change.
    depthai_node_name: "/oak"
    floodlight_param_name: "camera.i_floodlight_brightness"
    dot_projector_param_name: "camera.i_laser_dot_brightness"

    # Husarion's depthai-ros gates the floodlight current on a master
    # bool toggle (`camera.i_enable_ir`). Without flipping it, writing
    # the floodlight is silently a no-op. Set to "" on builds whose
    # floodlight current is unconditional (some upstream releases).
    ir_enable_param_name: "camera.i_enable_ir"

    # IR floodlight current (mA) per lighting state. OAK-D Pro takes
    # roughly 0..1500 mA. The dot projector is ALWAYS forced to 0 in
    # every state — its speckle pattern destroys QR decoding.
    ir_floodlight_bright_mA: 0
    ir_floodlight_dim_mA: 300
    ir_floodlight_dark_mA: 1000

command_interpreter:
  ros__parameters:
    # --- Speed ---
    # First-run safety profile: half the demo speeds. Re-tune for the demo
    # only after Phase 4 is clean (see plan / README).
    cruise_speed: 0.08 # m/s — base forward speed (demo: 0.2)
    turn_speed: 0.4 # rad/s — angular velocity for turns (demo: 0.8)
    speed_increment: 0.05 # m/s — SPEED_UP / SPEED_DOWN step
    min_speed: 0.05 # m/s — floor for SPEED_DOWN
    max_speed: 0.4 # m/s — ceiling for SPEED_UP

    # --- Turn durations ---
    # MUST be re-derived whenever turn_speed changes:
    #   90°  ≈ 1.5708 rad  →  duration = 1.5708 / turn_speed
    #   180° ≈ 3.1416 rad  →  duration = 3.1416 / turn_speed
    # At turn_speed=0.4 rad/s this gives ≈ 3.93 s and 7.85 s. Rounded up
    # slightly to compensate for spin-up / friction on first revolution.
    turn_90_duration: 4.0 # seconds for 90° turn (demo @ 0.8 rad/s: 2.0)
    turn_180_duration: 8.0 # seconds for 180° turn (demo @ 0.8 rad/s: 4.0)

    # --- Timing ---
    control_rate_hz: 20.0 # Hz
    # Tightened from 5.0 → 3.0 so the robot drops to RECOVERING (slow creep)
    # faster if vision drops out. Note: RECOVERING still moves at min_speed,
    # it is NOT a full stop. See Phase 5 of the plan.
    recovery_timeout: 3.0 # seconds — enter RECOVERING if no QR command (demo: 5.0)

qr_logger:
  ros__parameters:
    log_directory: "/tmp/qr_nav_logs"
    log_rate_hz: 5.0
